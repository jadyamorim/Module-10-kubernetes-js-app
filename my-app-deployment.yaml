apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: 651343917838.dkr.ecr.ca-west-1.amazonaws.com/my-app:1.0
        ports:
        - containerPort: 3000
